# Tunable config for the Predictions Cup bot. Nothing here is a secret —
# secrets (API keys, bot tokens) live only in .env. See CLAUDE.md for the
# hard rules these values must respect.

platform:
  base_url: "https://www.thesuper.market/api/v1"
  # TODO(api): fill in once we have an API key and have called GET /tournaments
  # to find the Predictions Cup's slug and UUID. Never rely on the org default.
  tournament_slug: "midterm-elections" # confirmed via GET /tournaments 2026-09-28
  tournament_id: null

trading:
  # Markets the bot never quotes: traded by hand only. Race keys (e.g.
  # "DE-Senate") or SIG market ids (e.g. "387"). An unknown entry stops the
  # bot at startup. Manual trades anywhere on the account are reconciled
  # (all account fills) and count toward the bot's risk limits. Don't leave
  # manual resting orders in markets the bot quotes: each re-quote cancels
  # that market's orders.
  manual_only: []

storage:
  db_path: "data/predcup.db" # SQLite, WAL mode; git-ignored (*.db)

kill_switch:
  file_path: "KILL" # repo root; presence halts all quoting and cancels orders
  poll_interval_seconds: 1.0 # predcup/killfile.py checks for the file this often
  wait_for_inflight_seconds: 30 # kill waits this long for an in-flight re-quote, then sweeps again
  telegram_kill_command: "/kill"

# predcup/alerts.py. Bot token and chat id are secrets: .env only.
telegram:
  confirm_timeout_seconds: 60 # /resetramp needs a YES reply within this
  min_send_interval_seconds: 1.0 # Telegram allows ~1 message/s per chat
  max_send_attempts: 3 # per alert, with backoff, then dropped (still in the log)

# predcup/watchdog.py + deploy/predcup.service WatchdogSec. The systemd ping
# is withheld once any of these App loops hasn't started an iteration for
# max_silence_seconds; systemd then restarts the bot, which cancels all Cup
# orders on start. Keep it above the slowest loop's interval
# (reconciliation, 60 s) plus a slow read.
watchdog:
  loops: [kalshi_poll, quoter, reconciliation]
  max_silence_seconds: 180
  default_ping_interval_seconds: 20 # only when not under systemd; else WatchdogSec / 3

# predcup/summary.py: Telegram summary once a day (P&L, fills, markouts, ramp,
# alerts in the last 24 h). Europe/London follows BST/GMT (clocks go back
# 25 Oct 2026). Missed while the bot was down -> sent on restart that day.
daily_summary:
  time: "08:00"
  timezone: "Europe/London"
  max_alerts_listed: 10

venues:
  kalshi:
    base_url: "https://external-api.kalshi.com/trade-api/v2" # docs/kalshi/openapi.yaml servers
    poll_interval_seconds: 10 # read-only, 5-15s per CLAUDE.md
    request_delay_seconds: 0.25 # pause after every GET; unauthenticated limit not documented
  polymarket:
    poll_interval_seconds: 10 # read-only, 5-15s per CLAUDE.md
  sig:
    # realtime token lasts 3h (docs/platform/SUMMARY.md); refresh with margin
    realtime_token_refresh_margin_seconds: 600
    request_delay_seconds: 0.1 # pause after every read in scripts; rate limits are not in the spec

fair_value:
  # blend Kalshi + Polymarket in log-odds space, liquidity-weighted
  max_outside_data_age_seconds: 60 # stale-data stop threshold (CLAUDE.md quoter rule)
  min_confidence_to_trade: 0.5 # market_map.csv confidence column; below this, no auto-trading
  kalshi: # v1 fair value = Kalshi mid, verified Tier A rows only (predcup/fairvalue.py)
    max_spread: 0.10 # wider Kalshi spread -> no fair value
    base_uncertainty: 0.005
    thin_volume: 1000 # lifetime contracts; below this adds thin_penalty
    thin_penalty: 0.01
    stale_penalty: 0.01 # added linearly with quote age, up to this at max_outside_data_age_seconds

# Phase 1 risk defaults (CLAUDE.md "Risk (Phase 1 defaults, in config)").
# Phase 2 loosens these only via an explicit config change, never in code.
risk:
  phase: 1
  max_bankroll_fraction_per_market: 0.05 # max 5% bankroll per market
  max_total_exposure_fraction: 0.60 # max 60% total exposure
  max_party_exposure_fraction: 0.25 # net exposure to one party/candidate across all races; per-market caps alone don't cover correlated polling error
  max_order_size_susqies: 500 # per-market max order size; TODO: tune once bankroll/market liquidity is known
  max_price_deviation_from_fair_value: 0.03 # limit price must be within this many points of fair value
  daily_loss_stop_fraction: 0.08 # daily loss stop 8%
  stale_data_stop_seconds: 60 # halt quoting if outside data older than this (mirrors fair_value.max_outside_data_age_seconds)
  reconciliation_interval_seconds: 60 # compare local positions vs get_positions() every minute
  reconciliation_max_read_failures: 3 # consecutive failed reconciliation reads before halting (live)
  # Launch size ramp: max_order_size_susqies and max_bankroll_fraction_per_market
  # start at launch_fraction of the values above and multiply by step_multiplier
  # after clean_reconciliations_per_step clean reconciliations in a row. A
  # reconciliation mismatch or unexpected 4xx drops one step and alerts. Each 429
  # alerts (the adapter backs off its request rate) but only drops a step when
  # more than rate_limit_max_in_window arrive within rate_limit_window_seconds.
  # 0.1 -> 0.2 -> 0.4 -> 0.8 -> 1.0; at 60 s reconciliation, 45 per step =
  # 45 min per step, ~3 h clean to full size. Step is saved in SQLite; a restart
  # resumes one step below the saved one. Reset: Telegram /resetramp (running)
  # or `python -m scripts.reset_ramp` (stopped). launch_fraction: 1.0 disables.
  size_ramp:
    launch_fraction: 0.10
    step_multiplier: 2.0
    clean_reconciliations_per_step: 45
    rate_limit_max_in_window: 5
    rate_limit_window_seconds: 600

# Trading loop must never block (CLAUDE.md "Process split"). Every loop
# iteration's lateness, and a background event-loop probe, go to events_log
# as loop_lag; lag above the threshold alerts (once per cooldown per loop).
loop_lag:
  alert_threshold_seconds: 1.0
  alert_cooldown_seconds: 60
  probe_interval_seconds: 0.5

quoter:
  min_edge: 0.01 # half-spread floor
  uncertainty_coefficient: 1.0 # c: half-spread = max(min_edge, c * uncertainty)
  inventory_skew_coefficient: 0.02 # k: reservation price = fair_value - k * inventory
  requote_fair_value_move_ticks: 2 # re-quote when fair value moves > 1 point (0.005 tick each)
  quote_expiration_seconds: 30 # dead-man's switch: every resting quote gets a short expirationDate
  refresh_interval_seconds: 20 # re-post before quotes expire; must be < quote_expiration_seconds
  cycle_interval_seconds: 5 # how often the quoter loop runs
  quote_size_shares: 20 # per side; small at launch (the risk size ramp caps notional on top)
  max_markets: 30
  max_position_shares: 200 # inventory skew is k * position / this; at +-this, stop adding on that side
  post_only: true # back off one tick rather than cross the SIG book
  # Blackout windows (UTC ISO) with no quotes at all, e.g. before debates:
  # - {start: "2026-10-06T00:00:00+00:00", end: "2026-10-06T03:00:00+00:00"}
  pull_quotes_before_events: []

# scripts/show_mapping.py warnings shown to the human verifying market_map.csv.
mapping_review:
  max_mid_diff: 0.10 # SIG vs Kalshi mid after polarity; bigger suggests an inverted/wrong mapping
  max_kalshi_spread: 0.05
  min_kalshi_volume: 1000 # lifetime contracts; below this the Kalshi price is not much of an anchor

# scripts/launch_report.py: which mapped markets look safe to launch on.
launch_report:
  max_gap: 0.03 # flag SIG mid vs polarity-adjusted Kalshi mid beyond this
  longshot_below: 0.10 # longshot-overpricing column only where Kalshi is under this
  exclude_states: [AK, GA, ME] # hand-picked exclusions for launch
  exclude_independent: true # every Independent market is excluded
  output_path: "data/launch_report.csv"
  unmapped_output_path: "data/launch_report_unmapped.csv" # SIG markets with no Kalshi ticker
  hand_trade_min_edge: 0.02 # "trade by hand at the open": SIG quote crosses Kalshi's by this much
  # low Kalshi volume uses mapping_review.min_kalshi_volume

alerts:
  gap_threshold: 0.03 # fair value vs platform price gap that triggers an alert
  yes_no_arb_threshold: 0.01 # YES+NO sum deviation from 1 that triggers an alert
  pair_inconsistency_threshold: 0.03 # cross-market consistency violation threshold

election_night:
  # Stage 1 step 8 quote-pull rule: pull quotes in a race on a credible call,
  # and in all uncalled races in a state at poll close. Populated in Stage 4.
  credible_call_sources: []
  poll_close_times_by_state: {}
